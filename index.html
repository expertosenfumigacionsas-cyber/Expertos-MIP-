<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Expertos MIP - Enterprise</title><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"><style>:root{--p:#0a0a1a;--s:#5c6bc0;--acc:#2ecc71;--bg:#f8f9fc;--w:#ffffff;--shadow:0 10px 30px rgba(0,0,0,0.08)}*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif}body{background:var(--bg);min-height:100vh;overflow-x:hidden}#login-screen{position:fixed;inset:0;background:var(--p);z-index:3000;display:flex;align-items:center;justify-content:center;padding:20px}#login-inner{background:white;width:100%;max-width:400px;padding:40px;border-radius:32px;text-align:center}.btn-primary{width:100%;padding:16px;background:var(--p);color:white;border:none;border-radius:16px;font-weight:700;cursor:pointer;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:10px}header{background:rgba(10,10,26,0.95);backdrop-filter:blur(10px);color:white;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:1000}.main-nav{background:white;display:flex;overflow-x:auto;padding:10px;border-bottom:1px solid #eee;position:sticky;top:54px;z-index:999;gap:10px}.nav-item{padding:8px 18px;background:#f0f2f5;border-radius:20px;font-size:0.8rem;font-weight:700;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;transition:0.2s}.nav-item.active{background:var(--s);color:white}.content{padding:20px;max-width:800px;margin:auto;padding-bottom:100px}.card{background:white;border-radius:20px;padding:20px;margin-bottom:15px;box-shadow:var(--shadow);border:1px solid rgba(0,0,0,0.03)}.role-badge{display:inline-block;padding:4px 12px;border-radius:12px;font-size:0.7rem;font-weight:800;background:#eee;margin-bottom:10px}input,select,textarea{width:100%;padding:14px;background:#f9f9fb;border:1px solid #e1e1e7;border-radius:14px;margin-bottom:12px;font-size:0.95rem}.sig-canvas{border:1px dashed #ccc;height:120px;background:#fafafa;border-radius:14px;margin:10px 0;display:flex;align-items:center;justify-content:center;font-size:0.7rem;color:#999}</style></head><body><div id="login-screen"><div id="login-inner"><h2>Expertos MIP</h2><p style="color:#666;margin-bottom:20px">Selecciona tu perfil</p><select id="role-select"><option value="admin">Administrador (Control Total)</option><option value="tecnico">Técnico (Portal de Campo)</option></select><input type="text" placeholder="Usuario" id="u"><button class="btn-primary" onclick="initApp()">ENTRAR <i class="fas fa-sign-in-alt"></i></button></div></div><div id="app" style="display:none"><header><div style="font-weight:900"><i class="fas fa-shield-virus"></i> EXPERTOS MIP</div><div id="role-tag" class="role-badge" style="margin:0;background:var(--s);color:white"></div></header><nav id="navbar" class="main-nav"></nav><div id="view" class="content"></div></div><script>let userRole='';function initApp(){userRole=document.getElementById('role-select').value;document.getElementById('login-screen').style.display='none';document.getElementById('app').style.display='block';document.getElementById('role-tag').innerText=userRole.toUpperCase();renderNav();go('home');}function renderNav(){const n=document.getElementById('navbar');let html=`<div class="nav-item active" onclick="go('home')"><i class="fas fa-home"></i> Inicio</div>`;if(userRole==='admin'){html+=`<div class="nav-item" onclick="go('agenda')"><i class="fas fa-calendar-alt"></i> Agendar</div><div class="nav-item" onclick="go('clientes')"><i class="fas fa-users"></i> Clientes</div>`;}else{html+=`<div class="nav-item" onclick="go('tareas')"><i class="fas fa-list-check"></i> Mis Tareas</div>`;}html+=`<div class="nav-item" onclick="go('insumos')"><i class="fas fa-flask"></i> Insumos</div><div class="nav-item" onclick="go('reporte')"><i class="fas fa-file-contract"></i> Reporte</div>`;n.innerHTML=html;}function go(v){document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));if(event&&event.currentTarget.classList)event.currentTarget.classList.add('active');const view=document.getElementById('view');if(v==='home'){view.innerHTML=`<div class="card"><h3>Bienvenido al Sistema</h3><p style="font-size:0.9rem;color:#666">Panel optimizado para ${userRole==='admin'?'gestión administrativa':'operación técnica'}.</p></div>`;}else if(v==='agenda'){view.innerHTML=`<h3>Programación</h3><div class="card"><input type="text" placeholder="Empresa"><input type="datetime-local"><button class="btn-primary">GUARDAR</button></div>`;}else if(v==='tareas'){view.innerHTML=`<h3>Tareas Asignadas</h3><div class="card" onclick="go('reporte')"><b>Smart Fit Sta. Bárbara</b><br><small>Fumigación MIP - Hoy 4:00 PM</small><br><button class="btn-primary" style="padding:8px;font-size:0.7rem">INICIAR SERVICIO</button></div>`;}else if(v==='insumos'){view.innerHTML=`<h3>Insumos Técnicos</h3><div class="card"><b>Deltametrina 2.5%</b><br><small>Uso: Rastreros | Dosis: 50ml/10L</small></div><div class="card"><b>Brodifacouma</b><br><small>Uso: Roedores | Bloque Parafinado</small></div>`;}else if(v==='reporte'){view.innerHTML=`<h3>Reporte de Servicio</h3><div class="card"><input type="text" placeholder="Cliente"><select><option>MIP</option><option>Lavado Tanques</option></select><textarea placeholder="Hallazgos..." rows="3"></textarea><div class="sig-canvas">ÁREA PARA FIRMA</div><button class="btn-primary">FINALIZAR Y ENVIAR</button></div>`;}}</script></body></html>
