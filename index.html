<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Expertos MIP - Fix</title><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"><style>:root{--p:#0a0a1a;--s:#5c6bc0;--bg:#f4f7fa;--w:#ffffff}*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}body{background:var(--bg);margin:0}#login{position:fixed;inset:0;background:var(--p);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}#login-box{background:white;width:100%;max-width:350px;padding:30px;border-radius:20px;text-align:center}header{background:var(--p);color:white;padding:15px;text-align:center;font-weight:bold;position:sticky;top:0;z-index:100}.tabs{background:white;display:flex;overflow-x:auto;padding:10px;border-bottom:1px solid #ddd;position:sticky;top:46px;z-index:99}.tab-btn{padding:10px 15px;background:#eee;border-radius:15px;margin-right:10px;font-size:0.8rem;font-weight:bold;white-space:nowrap;cursor:pointer;border:none}.tab-btn.active{background:var(--s);color:white}.view{display:none;padding:20px}.view.active{display:block}.card{background:white;padding:20px;border-radius:15px;margin-bottom:15px;box-shadow:0 2px 5px rgba(0,0,0,0.1)}input,select,textarea{width:100%;padding:12px;margin-bottom:10px;border:1px solid #ccc;border-radius:10px}.btn{width:100%;padding:15px;background:var(--p);color:white;border:none;border-radius:10px;font-weight:bold;cursor:pointer}</style></head><body><div id="login"><div id="login-box"><h2>Expertos MIP</h2><p style="margin-bottom:20px">Seleccione su Perfil</p><select id="role"><option value="admin">Administrador</option><option value="tecnico">Técnico</option></select><button class="btn" onclick="start()">ENTRAR</button></div></div><div id="app" style="display:none"><header id="h-title">EXPERTOS MIP</header><div id="nav-tabs" class="tabs"></div><div id="home" class="view active"><div class="card"><h3>Bienvenido</h3><p id="welcome-msg"></p></div></div><div id="agenda" class="view"><div class="card"><h3>Agendar Servicio</h3><input type="text" placeholder="Cliente"><input type="datetime-local"><button class="btn">GUARDAR</button></div></div><div id="tareas" class="view"><div class="card"><h3>Servicios de Hoy</h3><p>Smart Fit - Sta Bárbara (4:00 PM)</p><button class="btn" style="margin-top:10px">INICIAR REPORTE</button></div></div><div id="insumos" class="view"><div class="card"><b>Deltametrina 2.5%</b><br><small>Insecticida Rastreros</small></div><div class="card"><b>Brodifacouma</b><br><small>Rodenticida Bloque</small></div></div><div id="reporte" class="view"><div class="card"><h3>Reporte Técnico</h3><input type="text" placeholder="Cliente"><select><option>Fumigación MIP</option><option>Lavado Tanques</option></select><textarea placeholder="Hallazgos..." rows="4"></textarea><div style="border:1px dashed #ccc;height:100px;margin-bottom:10px;display:flex;align-items:center;justify-content:center;font-size:0.7rem;color:#999">FIRMA AQUÍ</div><button class="btn">FINALIZAR</button></div></div><div id="clientes" class="view"><div class="card"><h3>Clientes</h3><input type="text" placeholder="Buscar..."><p>Smart Fit - Santa Bárbara</p></div></div></div><script>function start(){const role=document.getElementById('role').value;document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';document.getElementById('welcome-msg').innerText='Panel de ' + role.toUpperCase();renderNav(role);}function renderNav(role){const nav=document.getElementById('nav-tabs');let html='<button class="tab-btn active" onclick="show('home')">Inicio</button>';if(role==='admin'){html+='<button class="tab-btn" onclick="show('agenda')">Agendar</button><button class="tab-btn" onclick="show('clientes')">Clientes</button>';}else{html+='<button class="tab-btn" onclick="show('tareas')">Mis Tareas</button>';}html+='<button class="tab-btn" onclick="show('insumos')">Insumos</button><button class="tab-btn" onclick="show('reporte')">Reporte</button>';nav.innerHTML=html;}function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tab-btn').forEach(b=>{b.classList.remove('active');if(b.innerText.toLowerCase()===id.toLowerCase()||(id==='home'&&b.innerText==='Inicio'))b.classList.add('active');});window.scrollTo(0,0);}</script></body></html>
