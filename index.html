<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Expertos MIP - Pro</title><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"><style>:root{--primary:#0d0e2b;--secondary:#5c6bc0;--accent:#c0392b;--bg:#f8f9fa;--text:#2c3e50;--white:#ffffff;--success:#27ae60}*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif}body{background:var(--bg);color:var(--text);min-height:100vh}header{background:var(--primary);color:white;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}.main-nav{background:white;display:flex;overflow-x:auto;padding:10px;border-bottom:1px solid #eee;gap:10px}.nav-item{padding:8px 18px;background:#f0f2f5;border-radius:20px;font-size:0.85rem;font-weight:600;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px}.nav-item.active{background:var(--secondary);color:white}.content{padding:15px}.section-title{font-size:1.1rem;font-weight:700;margin-bottom:15px;color:var(--primary);display:flex;align-items:center;gap:10px}.card{background:white;border-radius:10px;padding:15px;margin-bottom:15px;box-shadow:0 2px 8px rgba(0,0,0,0.06)}.form-group{margin-bottom:15px}.form-group label{display:block;font-size:0.85rem;font-weight:600;margin-bottom:5px}.form-group input, .form-group select, .form-group textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;font-size:0.9rem}.btn-main{width:100%;padding:12px;background:var(--primary);color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;margin-top:10px}.file-upload{border:2px dashed #ddd;padding:20px;text-align:center;border-radius:10px;background:#fcfcfc;cursor:pointer;margin-bottom:15px}.file-upload i{font-size:1.5rem;color:var(--secondary);margin-bottom:10px}.client-record{border-left:4px solid var(--success);padding-left:15px;margin-bottom:15px;position:relative}.badge{font-size:0.7rem;padding:2px 8px;border-radius:10px;background:var(--bg);color:var(--secondary);font-weight:700}</style></head><body><div id="app-screen"><header><div><i class="fas fa-shield-virus"></i> Expertos MIP</div><div style="font-size:0.8rem">Gestión Documental</div></header><nav class="main-nav"><div class="nav-item active" onclick="showV('clientes')"><i class="fas fa-users"></i> Clientes y Certificados</div><div class="nav-item" onclick="showV('agenda')"><i class="fas fa-calendar-plus"></i> Agenda</div></nav><div id="app-content" class="content"></div></div><script>let clients=[];function showV(v){const c=document.getElementById('app-content');document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));if(event)event.currentTarget.classList.add('active');if(v==='clientes'){c.innerHTML=`<div class="section-title">Registro de Certificaciones</div><div class="card"><div class="form-group"><label>Nombre del Cliente</label><input type="text" id="cl-name" placeholder="Ej: Smart Fit Centro"></div><div class="form-group"><label>Tipo de Control</label><select id="cl-type"><option>Manejo Integrado de Plagas (MIP)</option><option>Lavado de Tanques de Agua</option><option>Desinfección Ambiental</option><option>Control de Termitas</option></select></div><div class="form-group"><label>Subir Certificado / Registro Fotográfico</label><div class="file-upload" onclick="document.getElementById('cl-file').click()"><i class="fas fa-cloud-upload-alt"></i><p id="file-name">Click para adjuntar PDF o Imagen</p><input type="file" id="cl-file" style="display:none" onchange="updateFN()"></div></div><button class="btn-main" onclick="addCl()">Guardar Registro de Cliente</button></div><div class="section-title" style="margin-top:20px">Historial de Clientes</div><div id="cl-list">${clients.length?clients.map(cl=>`<div class="card client-record"><div class="badge">${cl.type}</div><h4 style="margin-top:5px">${cl.name}</h4><p style="font-size:0.8rem;color:#666"><i class="fas fa-file-alt"></i> Certificado: ${cl.file}</p></div>`).join(''):'<p style="font-size:0.8rem;color:#999;text-align:center">No hay registros cargados.</p>'}</div>`;}else if(v==='agenda'){c.innerHTML='<div class="section-title">Agenda</div><p>Módulo de agenda cargado...</p>';}}function updateFN(){const f=document.getElementById('cl-file');document.getElementById('file-name').innerText=f.files[0]?f.files[0].name:'Click para adjuntar PDF o Imagen';}function addCl(){const name=document.getElementById('cl-name').value,type=document.getElementById('cl-type').value,file=document.getElementById('cl-file').files[0];if(name&&file){clients.push({name,type,file:file.name});showV('clientes');}else alert('Por favor complete el nombre y adjunte un archivo');}showV('clientes');</script></body></html>
